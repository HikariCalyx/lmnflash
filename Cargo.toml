[package]
name = "lmnflash"
version = "0.2.1-prerelease2"
edition = "2024"

[dependencies]
# `advanced` exposes `iced::advanced` (the `Widget` trait and the renderer's
# layer/transformation API), which the feature-switch transitions in
# `src/anim.rs` draw through.
#
# iced 0.14 removed the `system` feature (system fonts and advanced shaping
# are now always available), so it is no longer listed here.
iced = { version = "0.14", features = ["tokio", "image", "canvas", "advanced"] }

# The Fluent 2 theme used by the whole UI. iced 0.14 lets a theme be its own
# type (`Theme` implements the `Base` trait and every widget `Catalog`), so the
# crate's `Theme` becomes the application's theme type.
#
# Vendored under `vendor/iced-fluent-theme` (MIT): the upstream crate does not
# implement `text_editor::Catalog`, which iced 0.14 requires to use the
# `text_editor` widget (the Bulk IMEI input), and the orphan rule prevents us
# from adding it from here. The vendored copy adds it.
iced-fluent-theme = { path = "vendor/iced-fluent-theme" }
fluent = "0.16"
unic-langid = "0.9"
wry = "0.50"
winit = "0.30"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
directories = "5"
open = "5"
rsa = { version = "0.9", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
tokio = { version = "1", features = ["rt"] }
fastboot = { path = "fastboot" }
# The Qualcomm Partition Manager talks to a phone in EDL mode over the USB
# serial port (05C6:9008) it enumerates as: Sahara and Firehose are both
# plain serial protocols. `serial2` is the same crate the reference `qdl`
# implementation uses, and it opens `COM10` and above through the Win32
# device namespace itself.
serial2 = "0.2"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
rfd = { version = "0.17", default-features = false }

# `flashfile.xml` parsing (firmware-flash mode).
roxmltree = "0.20"

# Firmware packages are ZIP archives; only Deflate is needed (no encryption).
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# `flashfile.xml` carries an MD5 for every image file.
md5 = "0.7"

# Local time for the Multi Flashing log: the run's directory is named after the
# moment "Start" was pressed, and every log line is stamped with the time it was
# written. The standard library cannot turn a `SystemTime` into local calendar
# time, and the offset changes with the season (DST). Only the clock and the
# formatting are needed — no `serde`, no `wasmbind`, no timezone database.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Wireless ADB pairing ("Connect ADB Wireless Debugging"): the QR code the
# phone's "Pair device with QR code" screen scans, and the mDNS browse that
# finds the pairing/connect services it then announces. The QR code is only
# *encoded* here — it is drawn by the canvas widget — so the image and SVG
# renderer backends the crate ships by default are left out.
qrcode = { version = "0.14", default-features = false }
mdns-sd = "0.21"

# Native folder picker backend on Linux. GTK3 only: rfd 0.17 forbids
# enabling `gtk3` and `xdg-portal` at the same time, and GTK3 is already
# a dependency of the Linux webview dialog anyway.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

# Linux webview dialog (wry's WebKitGTK backend needs a GTK container).
gtk = "0.18"

# Windows registry access (WebView2 runtime detection) without spawning
# `reg.exe`, and the shell call that opens Device Manager from the Qualcomm
# page. `mmc.exe` auto-elevates, so `CreateProcess` refuses it
# (ERROR_ELEVATION_REQUIRED) and `ShellExecuteW` has to ask for the elevation.
# Both crates are already in the tree (via wry/winit), so this downloads
# nothing new.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: the `softwarefix://` callback arrives as a `kAEGetURL` Apple Event,
# which iced/winit provides no API for, so `src/protocol.rs` handles it with a
# small `NSAppleEventManager` handler of its own. Already in the tree (wry and
# winit use it), so depending on it directly downloads nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
embed-resource = "2"

[dev-dependencies]
fluent-syntax = "0.11"

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to allow more optimizations
panic = 'abort'     # Remove stack unwinding logic
strip = true        # Automatically strip symbols from the binary
