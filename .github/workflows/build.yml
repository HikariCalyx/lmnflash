name: Build

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Windows & Linux ────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (x86_64 and i686 cross-compile from the x86_64 runner;
          # aarch64 builds natively on the Windows ARM runner)
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: lmnflash.exe
            upx: false
          - target: i686-pc-windows-msvc
            runner: windows-latest
            binary: lmnflash.exe
            upx: false
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            binary: lmnflash.exe
          # Linux (iced + rusb/libusb + wry/WebKitGTK deps installed below)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary: lmnflash
            upx: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: lmnflash
            upx: false

    steps:
      - uses: actions/checkout@v4
        with:
          # `src/driver_install.rs` embeds the udev rules installer from the
          # `vendor/android-udev-rules` submodule at compile time.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.runner }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.target }}-cargo-

      # iced needs X11/Wayland headers; fastboot needs libusb;
      # wry's webview backend needs WebKitGTK 4.1 + libsoup3 + GTK 3
      # (only available on Ubuntu 24.04+).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libusb-1.0-0-dev \
            pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install UPX (Windows)
        if: matrix.upx && runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath upx
          "$PWD\upx\upx-5.2.0-win64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install UPX (Linux)
        if: matrix.upx && runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y upx-ucl

      - name: Run UPX
        if: matrix.upx
        shell: bash
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmnflash-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # ── Debian package (x86_64) ────────────────────────────────────────────────
  #
  # The package is wrapped around the executable the Linux build already made,
  # so nothing is compiled here: the tree is laid out and packed with
  # `dpkg-deb`. The file name is the one a Debian repository shows —
  # `<package>_<version>_<architecture>.deb`, the version taken from
  # `Cargo.toml` — and `Depends` names the runtime libraries the application
  # needs: the GTK3/WebKitGTK stack behind the WebView dialog and the file
  # pickers, and the X11/Wayland libraries iced starts with. USB is static and
  # therefore absent from the list (see below).
  build-deb:
    name: Debian package (amd64)
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - uses: actions/checkout@v4
        # No submodules: nothing is compiled here. The launcher entry and the
        # icon are in the repository, and the executable comes from `build`.

      - name: Download the Linux executable
        uses: actions/download-artifact@v4
        with:
          name: lmnflash-x86_64-unknown-linux-gnu
          path: bin

      - name: Read the package version
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Package version: $version"

      - name: Assemble the package tree
        run: |
          set -euo pipefail
          root=pkg
          folder="$root/usr/lib/lmnflash"

          # The executable sits in a folder of its own because that is where the
          # application looks for an `mfastboot` build — an
          # `mfastboot/<platform>/<version>/` folder beside the running
          # executable. None is shipped here (the tarball carries one), so the
          # app starts with its built-in fastboot until one is put there or
          # Google's platform-tools are downloaded from the tool picker.
          # `/usr/bin` gets a symlink to it, so the command is on `PATH` — a
          # symlink is enough, since `current_exe()` resolves it and the app
          # still looks beside the real file.
          install -D -m755 bin/lmnflash "$folder/lmnflash"
          install -d "$root/usr/bin"
          ln -s ../lib/lmnflash/lmnflash "$root/usr/bin/lmnflash"

          # The launcher entry (`linux/lmnflash.desktop`, the same file the RPM
          # uses), so the application appears in the menu once the package is
          # installed. Package and icon are named `lmnflash`, which is what
          # makes `Icon=lmnflash` resolve; `MimeType` declares the
          # `softwarefix://` scheme the app can take over (it also writes a
          # per-user entry when it is asked to become the handler).
          install -D -m644 linux/lmnflash.desktop \
            "$root/usr/share/applications/lmnflash.desktop"

          # 512x512 is a size hicolor lists; the source icon is larger than
          # that, which only makes it sharper.
          install -D -m644 src/icon.png \
            "$root/usr/share/icons/hicolor/512x512/apps/lmnflash.png"

          # Debian policy: the copyright of everything shipped, and a changelog.
          install -D -m644 LICENSE "$root/usr/share/doc/lmnflash/copyright"
          cat > "$root/usr/share/doc/lmnflash/changelog.Debian" <<CHANGELOG
          lmnflash ($VERSION) unstable; urgency=medium

            * Release $VERSION.

           -- HikariCalyx <HikariCalyx@users.noreply.github.com>  $(date -R)
          CHANGELOG
          gzip -9n "$root/usr/share/doc/lmnflash/changelog.Debian"

          # The control file. `libgtk-3-0`/`libglib2.0-0`/`libsoup-3.0-0`/
          # `libwebkit2gtk-4.1-0` are spelled with an alternative because
          # Ubuntu 24.04 and Debian 13 renamed them for the 64-bit `time_t`
          # transition, while older releases kept the plain names.
          #
          # libusb is NOT in the list: the `fastboot` crate enables rusb's
          # `vendored` feature, so libusb is compiled into the executable
          # rather than loaded from the system. X11 and xkbcommon are named even
          # though iced opens them at runtime (they are loaded with dlopen, so
          # they are not in the executable's `NEEDED` list): without them the
          # window cannot be created at all.
          #
          # libc6 is not in the list either, although it is the library the
          # executable uses most: it is an ESSENTIAL package, so every Debian
          # system has it and naming it would only add a version floor (the
          # binary is built against glibc 2.39, the one Ubuntu 24.04 ships — see
          # the README for which releases that means).
          mkdir -p "$root/DEBIAN"
          installed_size=$(du -k -s "$root/usr" | cut -f1)
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: lmnflash
          Version: $VERSION
          Architecture: amd64
          Maintainer: HikariCalyx <HikariCalyx@users.noreply.github.com>
          Installed-Size: $installed_size
          Section: utils
          Priority: optional
          Homepage: https://github.com/HikariCalyx/lmnflash
          Depends: libgcc-s1, libglib2.0-0 (>= 2.66.0) | libglib2.0-0t64, libgtk-3-0 (>= 3.24.24) | libgtk-3-0t64, libsoup-3.0-0 | libsoup-3.0-0t64, libwebkit2gtk-4.1-0 | libwebkit2gtk-4.1-0t64, libx11-6, libxcb1, libxkbcommon0 (>= 1.0.0), libwayland-client0 (>= 1.20.0)
          Recommends: xdg-utils
          Description: firmware lookup and flashing utility for Lenovo, Motorola and NEC devices
           LMN Flash looks up and flashes firmware for Lenovo/Motorola smartphones
           and tablets, unlocks bootloaders, resets a phone to its factory state,
           removes preinstalled applications over ADB, and unpacks Lenovo,
           Motorola and Unisoc firmware packages.
           .
           The devices are spoken to directly over USB (fastboot/ADB); Google's
           platform-tools are downloaded when they are needed.
          CONTROL

      - name: Build the .deb
        run: |
          set -euo pipefail
          dpkg-deb --build --root-owner-group pkg "lmnflash_${VERSION}_amd64.deb"
          dpkg-deb --info "lmnflash_${VERSION}_amd64.deb"
          dpkg-deb --contents "lmnflash_${VERSION}_amd64.deb"

      # A hand-written `Depends` is only worth anything if it is complete, so
      # every library the executable loads is mapped to the package that ships
      # it. The list is printed either way, and a library whose package is
      # missing only warns (the package is usable — `apt` resolves the rest of
      # the library tree through the dependencies above — and the fix is one
      # line in that list).
      - name: Check the declared dependencies
        run: |
          set -uo pipefail
          executable=pkg/usr/lib/lmnflash/lmnflash
          declared=$(dpkg-deb --field "lmnflash_${VERSION}_amd64.deb" Depends \
            | tr ',' '\n' | tr '|' '\n' | awk '{ print $1 }')

          echo "Libraries the executable loads:"
          ldd "$executable" | sed 's/^/  /'

          for library in $(ldd "$executable" | awk '/=>/ { print $3 }'); do
            owner=$(dpkg -S "$(readlink -f "$library")" 2>/dev/null \
              | head -1 | cut -d: -f1) || continue

            if [ -z "$owner" ]; then
              continue

            # An essential package is on every system by definition, so it
            # needs no dependency entry (`libc6` is one).
            elif [ "$(dpkg-query -W -f='${Essential}' "$owner" 2>/dev/null)" = "yes" ]; then
              continue

            elif ! printf '%s\n' "$declared" | grep -qx "$owner"; then
              echo "::warning file=.github/workflows/build.yml::$executable loads $library, which $owner ships — add it to Depends"
            fi
          done

      - name: Upload the Debian package
        uses: actions/upload-artifact@v4
        with:
          name: lmnflash-deb
          path: lmnflash_*_amd64.deb
          if-no-files-found: error

  # ── RPM package (x86_64) ───────────────────────────────────────────────────
  #
  # The same wrapping as the Debian package, for the RPM distributions
  # (`rpmbuild` comes from the distribution's `rpm` package). The file name is
  # the one an RPM repository shows — `<name>-<version>-<release>.<architecture>.rpm`
  # — and the libraries the executable needs are NOT listed by hand: rpmbuild
  # reads them out of the executable, including the glibc symbol versions it
  # was linked against. That is also what makes one package work on Fedora,
  # RHEL and openSUSE, where the library package names all differ.
  build-rpm:
    name: RPM package (x86_64)
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - uses: actions/checkout@v4
        # No submodules: nothing is compiled here.

      - name: Install rpmbuild
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm

      - name: Download the Linux executable
        uses: actions/download-artifact@v4
        with:
          name: lmnflash-x86_64-unknown-linux-gnu
          path: bin

      - name: Read the package version and date
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The `%changelog` entry the spec below is written with; the padded
          # day is the form rpm's own tools (`rpmdev-bumpspec`) produce.
          echo "CHANGELOG_DATE=$(date '+%a %b %d %Y')" >> "$GITHUB_ENV"
          echo "Package version: $version"

      - name: Build the .rpm
        run: |
          set -euo pipefail
          topdir=$PWD/rpmbuild
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS}

          install -m755 bin/lmnflash "$topdir/SOURCES/lmnflash"
          install -m644 linux/lmnflash.desktop "$topdir/SOURCES/lmnflash.desktop"
          install -m644 src/icon.png "$topdir/SOURCES/lmnflash.png"
          install -m644 LICENSE "$topdir/SOURCES/LICENSE"

          cat > "$topdir/SPECS/lmnflash.spec" <<SPEC
          Name:           lmnflash
          Version:        $VERSION
          Release:        1
          Summary:        Firmware lookup and flashing utility for Lenovo, Motorola and NEC devices
          License:        MIT
          URL:            https://github.com/HikariCalyx/lmnflash
          BuildArch:      x86_64

          # The library dependencies are deliberately not listed: rpmbuild's ELF
          # dependency generator names them from the executable itself (with the
          # glibc symbol version it was built against), and those names are the
          # only ones every RPM distribution agrees on. libusb is compiled into
          # the executable, so it is not among them. Only the two things the
          # generator cannot see are listed: the icon theme directory, and
          # xdg-utils, whose xdg-mime the login callback registration runs.
          Requires:       hicolor-icon-theme
          Requires:       xdg-utils

          %description
          LMN Flash looks up and flashes firmware for Lenovo/Motorola smartphones
          and tablets, unlocks bootloaders, resets a phone to its factory state,
          removes preinstalled applications over ADB, and unpacks Lenovo,
          Motorola and Unisoc firmware packages.

          The devices are spoken to directly over USB (fastboot/ADB); Google's
          platform-tools are downloaded when they are needed.

          %install
          # The executable lives in a folder of its own (/usr/lib64 on a 64-bit
          # RPM distribution): that is where the application looks for an
          # `mfastboot/<platform>/<version>/` build, and it resolves the
          # /usr/bin symlink to get there. No mfastboot is shipped here — the
          # app uses its built-in fastboot, or Google's platform-tools that it
          # downloads when they are picked.
          install -D -m755 %{_sourcedir}/lmnflash %{buildroot}%{_libdir}/lmnflash/lmnflash
          install -d %{buildroot}%{_bindir}
          ln -s %{_libdir}/lmnflash/lmnflash %{buildroot}%{_bindir}/lmnflash
          install -D -m644 %{_sourcedir}/lmnflash.desktop %{buildroot}%{_datadir}/applications/lmnflash.desktop
          install -D -m644 %{_sourcedir}/lmnflash.png %{buildroot}%{_datadir}/icons/hicolor/512x512/apps/lmnflash.png
          install -D -m644 %{_sourcedir}/LICENSE %{buildroot}/usr/share/licenses/lmnflash/LICENSE

          # No %post/%postun scriptlets are needed: the desktop-file-utils and
          # gtk-update-icon-cache file triggers rebuild those caches when the
          # package is installed.
          %files
          %{_bindir}/lmnflash
          %{_libdir}/lmnflash
          %{_datadir}/applications/lmnflash.desktop
          %{_datadir}/icons/hicolor/512x512/apps/lmnflash.png
          %license /usr/share/licenses/lmnflash/LICENSE

          %changelog
          * $CHANGELOG_DATE HikariCalyx <HikariCalyx@users.noreply.github.com> - $VERSION-1
          - Release $VERSION.
          SPEC

          rpmbuild --define "_topdir $topdir" -bb "$topdir/SPECS/lmnflash.spec"
          cp "$topdir"/RPMS/x86_64/*.rpm .

      - name: Show the package
        run: |
          set -euo pipefail
          package=$(ls lmnflash-*.rpm)
          rpm -qpi "$package"
          echo "--- files ---"
          rpm -qpl "$package"
          echo "--- dependencies ---"
          rpm -qpR "$package"

          # Every library the executable loads must be named by the generated
          # dependencies, or the package would install where it cannot run.
          if ! rpm -qpR "$package" | grep -q 'libgtk-3'; then
            echo "::warning file=.github/workflows/build.yml::$package names no GTK3 library — check rpm's ELF dependency generator"
          fi

      - name: Upload the RPM package
        uses: actions/upload-artifact@v4
        with:
          name: lmnflash-rpm
          path: lmnflash-*.rpm
          if-no-files-found: error

  # ── macOS .app bundle + DMG (universal: x86_64 + aarch64) ────────────────
  build-macos:
    name: macOS (.app + DMG)
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v4
        with:
          # `src/driver_install.rs` embeds the udev rules installer from the
          # `vendor/android-udev-rules` submodule at compile time.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      # No native SDKs to install: the `fastboot` crate pulls in `rusb` with its
      # `vendored` feature, so libusb is compiled from source for each slice by
      # the `cc` crate (clang --target=<triple>) and every other native
      # dependency is a system framework (AppKit/WebKit/IOKit).
      # In particular there is no x86_64 Homebrew prefix to set up: Homebrew
      # refuses to install on Intel macOS (including under Rosetta 2), and it
      # was never needed here anyway.

      - name: Install Python dependencies
        run: pip3 install --break-system-packages semver toml mako dmgbuild

      - name: Build .app bundle + DMG
        run: bash macos/build.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lmnflash-macos-dmg
          path: dist/lmnflash-macos_unsigned.dmg
          if-no-files-found: error

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build, build-deb, build-rpm, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts for release
        run: |
          set -euo pipefail
          mkdir release

          # Standalone binaries are NOT published on their own any more: the
          # release page only carries the distribution packages (ZIP/TAR.GZ/
          # DMG). The bundle steps below take the executables straight from the
          # downloaded artifacts, so nothing has to be staged here.
          #
          # Windows
          # cp artifacts/lmnflash-x86_64-pc-windows-msvc/lmnflash.exe   release/lmnflash-win64.exe
          # cp artifacts/lmnflash-i686-pc-windows-msvc/lmnflash.exe     release/lmnflash-win32.exe
          # cp artifacts/lmnflash-aarch64-pc-windows-msvc/lmnflash.exe  release/lmnflash-win-arm64.exe
          #
          # Linux
          # cp artifacts/lmnflash-x86_64-unknown-linux-gnu/lmnflash     release/lmnflash-linux-x86_64
          # cp artifacts/lmnflash-aarch64-unknown-linux-gnu/lmnflash    release/lmnflash-linux-arm64

          # Debian package, built by the `build-deb` job out of the same x86_64
          # executable; it already carries the name a Debian repository uses
          # (`lmnflash_<version>_amd64.deb`), so it is published as it is.
          cp artifacts/lmnflash-deb/lmnflash_*_amd64.deb release/

          # RPM package, from the same executable (`lmnflash-<version>-1.x86_64.rpm`
          # is the name an RPM repository uses).
          cp artifacts/lmnflash-rpm/lmnflash-*.rpm release/

          # macOS
          cp artifacts/lmnflash-macos-dmg/lmnflash-macos_unsigned.dmg release/lmnflash-macos_unsigned.dmg

      # The firmware-flash feature looks for mfastboot next to the binary; the
      # platform folder names what the payload is, and the app only offers a
      # folder its machine can run.
      #
      # Every Windows artifact carries the same 32-bit `mfastboot` (there is no
      # 64-bit or ARM build of it): Windows runs it on all three of them — as it
      # is on win32, through WOW64 on win64 and through its own x86 emulation on
      # ARM64 — so it is named after what it really is instead of after the app
      # it travels with.
      - name: Bundle mfastboot with the Windows builds
        run: |
          set -euo pipefail
          for name in win64 win32 win-arm64; do
            case "$name" in
              win64)     target=x86_64-pc-windows-msvc ;;
              win32)     target=i686-pc-windows-msvc ;;
              win-arm64) target=aarch64-pc-windows-msvc ;;
            esac
            for version in 34.0.4 28.0.2 26.0.0; do
              mkdir -p "bundle-$name/mfastboot/windows_x86/$version"
              cp prebuilt_binary/windows/$version/* "bundle-$name/mfastboot/windows_x86/$version/"
            done
            cp "artifacts/lmnflash-$target/lmnflash.exe" "bundle-$name/lmnflash.exe"
            (cd "bundle-$name" && zip -r -q "../release/lmnflash-$name.zip" .)
          done

      # Both Linux builds carry the Intel `mfastboot` (there is no ARM build of
      # it): it runs as it is on x86_64 and through box64 on arm64, where the
      # app only offers it once box64 is installed — and says how to install it
      # otherwise.
      - name: Bundle mfastboot with the Linux builds
        run: |
          set -euo pipefail
          for arch in x86_64 arm64; do
            case "$arch" in
              x86_64) target=x86_64-unknown-linux-gnu ;;
              arm64)  target=aarch64-unknown-linux-gnu ;;
            esac
            mkdir -p "bundle-linux-$arch/mfastboot/linux_amd64/31.0.2"
            cp "artifacts/lmnflash-$target/lmnflash" "bundle-linux-$arch/lmnflash"
            cp prebuilt_binary/linux_amd64/31.0.2/mfastboot \
               "bundle-linux-$arch/mfastboot/linux_amd64/31.0.2/mfastboot"
            chmod +x "bundle-linux-$arch/lmnflash" \
                     "bundle-linux-$arch/mfastboot/linux_amd64/31.0.2/mfastboot"
            tar -C "bundle-linux-$arch" -czf "release/lmnflash-linux-$arch.tar.gz" .
          done

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
